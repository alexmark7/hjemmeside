e="9.5" font-weight="400" fill="#46536a" text-anchor="start">or what broke when you tried it.</text><line x1="276" y1="366" x2="560" y2="366" stroke="#e1d6c1" stroke-width="0.9"/><line x1="276" y1="384" x2="588" y2="384" stroke="#e1d6c1" stroke-width="0.9"/><line x1="276" y1="402" x2="520" y2="402" stroke="#e1d6c1" stroke-width="0.9"/><text x="276" y="452" font-family="'DM Sans', 'Segoe UI', 'Trebuchet MS', sans-serif" font-size="8" font-weight="700" fill="#6d788a" text-anchor="start" letter-spacing="1.1">Questions, feedback, bug reports</text></g><g ><rect x="700" y="196" width="248" height="84" rx="24" fill="#dce8f4" stroke="#2f6db5" stroke-width="1.4"/><polygon points="746,278 730,306 770,278" fill="#dce8f4"/><path d="M746 278 L730 306 L770 278" fill="none" stroke="#2f6db5" stroke-width="1.4" stroke-linejoin="round"/><line x1="747" y1="278" x2="769" y2="278" stroke="#dce8f4" stroke-width="2.4"/><text x="724" y="230" font-family="Syne, 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#21476d" text-anchor="start">I have a question</text><text x="724" y="250" font-family="'DM Sans', 'Segoe UI', 'Trebuchet MS', sans-serif" font-size="8.5" font-weight="500" fill="#47677f" text-anchor="start">about a card field.</text></g><g ><rect x="808" y="330" width="254" height="74" rx="22" fill="#e7f0e8" stroke="#3c7a5f" stroke-width="1.4"/><polygon points="882,402 870,430 906,402" fill="#e7f0e8"/><path d="M882 402 L870 430 L906 402" fill="none" stroke="#3c7a5f" stroke-width="1.4" stroke-linejoin="round"/><line x1="883" y1="402" x2="905" y2="402" stroke="#e7f0e8" stroke-width="2.4"/><text x="832" y="360" font-family="Syne, 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#285c43" text-anchor="start">A small bug report</text><text x="832" y="380" font-family="'DM Sans', 'Segoe UI', 'Trebuchet MS', sans-serif" font-size="8.5" font-weight="500" fill="#4a6d5a" text-anchor="start">with just enough detail.</text></g><g ><rec